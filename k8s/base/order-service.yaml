# Spring Boot order/trade API. Port = ORDER_SERVICE_PORT (config.env) = 8081.
# To change the port: config.env ORDER_SERVICE_PORT (+ SERVER_PORT below) + the "8081" below + ingress.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: order-service
          image: etp-order-service
          ports:
            - { name: http, containerPort: 8081 }
          envFrom:
            - configMapRef: { name: etp-config }
            - configMapRef: { name: etp-urls }
            - secretRef: { name: etp-secrets }
          env:
            - { name: SHARED_CONFIG, value: /config/application.yml }
            - { name: SERVER_PORT, value: "8081" }          # beats server.port in application.yml
            - { name: STRATEGY_TRADE_API_URL, value: "http://127.0.0.1:8081" }
            - { name: JAVA_OPTS, value: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError" }
          volumeMounts:
            - { name: shared-config, mountPath: /config, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 250m, memory: 640Mi }
            limits: { memory: 1280Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
      volumes:
        - name: shared-config
          configMap: { name: etp-shared-config }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector: { app: order-service }
  ports:
    - { name: http, port: 8081, targetPort: http }
