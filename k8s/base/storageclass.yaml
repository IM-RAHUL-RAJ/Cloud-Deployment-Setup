# EBS gp3 volumes for Kafka (and the optional in-cluster Postgres). Needs the aws-ebs-csi-driver addon.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
