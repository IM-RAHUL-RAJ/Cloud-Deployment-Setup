# Tested configuration used by k8s/DEPLOYMENT-ETP-TESTED.md.
# Run from the repository root: eksctl create cluster -f k8s/cluster.example.yaml
# Two t3.medium nodes were sufficient for the tested deployment.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: etp-cluster-2
  region: ap-south-1
managedNodeGroups:
  - name: workers
    instanceType: t3.medium
    minSize: 2
    desiredCapacity: 2
    maxSize: 3
    volumeSize: 30
    privateNetworking: true
iam:
  withOIDC: true
addons:
  - name: vpc-cni
  - name: kube-proxy
  - name: coredns
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true
